name: JavaScript ayrıştırma kontrolü
on:
  pull_request:
  push:
    branches: ['master', 'codex/**']
permissions:
  contents: read
jobs:
  javascript-kontrolu:
    name: Sayfa betikleri ve entegrasyon açılışı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Kaynak betiklerini ayrıştır ve kurgusal açılışı doğrula
        run: node scripts/check-javascript.cjs

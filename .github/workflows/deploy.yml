name: HC Sigorta GitHub Pages dağıtımı

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4
        
      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v4
        
      - name: Dağıtım dosyalarını hazırla
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.'
          
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v3
